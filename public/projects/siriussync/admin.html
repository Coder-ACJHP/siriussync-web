<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiriusSync - Lisans Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Başlık ve API Key Alanı -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 mb-4 md:mb-0">SiriusSync Admin</h1>
            <div class="flex w-full md:w-auto gap-2">
                <input type="password" id="apiKey" placeholder="Admin API Key" class="border p-2 rounded w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="fetchLicenses()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Bağlan</button>
            </div>
        </div>

        <!-- Yükleniyor -->
        <div id="loading" class="hidden flex justify-center py-10">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        </div>

        <!-- Hata / Mesaj -->
        <div id="message" class="hidden p-4 mb-6 rounded text-white text-center font-medium"></div>

        <!-- İçerik Alanı -->
        <div id="content" class="hidden">
            <div class="flex justify-end mb-4">
                <button onclick="showNewLicenseModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition font-medium">+ Yeni Cihaz Ekle</button>
            </div>

            <!-- Şirketler Listesi -->
            <div id="companiesContainer" class="space-y-6"></div>
        </div>
    </div>

    <!-- Modül Düzenleme Modalı -->
    <div id="moduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4" id="modalTitle">Modülleri Düzenle</h2>
            <input type="hidden" id="modalHwid">
            <div id="modulesList" class="grid grid-cols-2 gap-3 mb-6"></div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('moduleModal')" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">İptal</button>
                <button onclick="saveModules()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Bilgi Düzenleme Modalı (YENİ) -->
    <div id="editInfoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Cihaz Bilgilerini Düzenle</h2>
            <input type="hidden" id="editHwid">
            <div class="space-y-3 mb-6">
                <label class="block text-sm font-medium text-gray-700">Şirket Adı</label>
                <input type="text" id="editCompany" class="w-full border p-2 rounded">
                <label class="block text-sm font-medium text-gray-700 mt-2">Kullanıcı / Cihaz Adı</label>
                <input type="text" id="editOwner" class="w-full border p-2 rounded">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('editInfoModal')" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">İptal</button>
                <button onclick="saveDeviceInfo()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Güncelle</button>
            </div>
        </div>
    </div>

    <!-- Yeni Lisans Ekleme Modalı -->
    <div id="newLicenseModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Yeni Cihaz Kaydı</h2>
            <div class="space-y-3 mb-6">
                <input type="text" id="newHwid" placeholder="HWID (Cihaz Kimliği)" class="w-full border p-2 rounded">
                <input type="text" id="newCompany" placeholder="Şirket Adı" class="w-full border p-2 rounded">
                <input type="text" id="newOwner" placeholder="Kullanıcı Adı (Örn: Muhasebe-PC)" class="w-full border p-2 rounded">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('newLicenseModal')" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">İptal</button>
                <button onclick="createNewLicense()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://siriussync-auth.coderacjhp.workers.dev";
        const ALL_MODULES = ["products", "costsheets", "categories", "crm", "exchange_rate", "som", "pom", "datatransfer", "barcode", "receipts", "movements", "users", "notifications"];
        const STD_MODULES = ["products", "costsheets", "categories", "crm", "exchange_rate"];
        let licensesData = [];

        window.onload = () => {
            const savedKey = localStorage.getItem('adminKey');
            if(savedKey) {
                document.getElementById('apiKey').value = savedKey;
                fetchLicenses();
            }
        };

        function getHeaders() {
            const key = document.getElementById('apiKey').value;
            localStorage.setItem('adminKey', key);
            return { "Content-Type": "application/json", "x-admin-key": key };
        }

        function showMessage(text, isError = false) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `p-4 mb-6 rounded text-white text-center font-medium ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            msgEl.classList.remove('hidden');
            setTimeout(() => msgEl.classList.add('hidden'), 4000);
        }

        async function fetchLicenses() {
            if(!document.getElementById('apiKey').value) return showMessage("Lütfen API Key girin.", true);
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/admin/listHWIDs`, { method: "GET", headers: getHeaders() });
                const json = await res.json();

                if(!json.success) throw new Error(json.message);
                
                licensesData = json.data;
                renderCompanies();
                document.getElementById('content').classList.remove('hidden');
            } catch(e) {
                showMessage("Bağlantı hatası: " + e.message, true);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderCompanies() {
            const container = document.getElementById('companiesContainer');
            container.innerHTML = '';

            const companies = {};
            licensesData.forEach(lic => {
                const comp = lic.companyName || "Bilinmeyen Şirket";
                if(!companies[comp]) companies[comp] = [];
                companies[comp].push(lic);
            });

            for (const [companyName, devices] of Object.entries(companies)) {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow overflow-hidden";
                
                let devicesHTML = devices.map(d => {
                    const displayModules = d.modules.map(m => STD_MODULES.includes(m) ? `${m} <span class="text-gray-400">(std)</span>` : m).join(', ');
                    
                    return `
                    <div class="flex flex-col md:flex-row items-center justify-between p-4 border-b last:border-0 hover:bg-gray-50 group">
                        <div class="flex-1 mb-3 md:mb-0">
                            <p class="font-bold text-gray-800 flex items-center gap-2">
                                ${d.ownerName} <span class="text-xs text-gray-500 font-normal">(${d.deviceName || 'Cihaz Adı Yok'})</span>
                                <button onclick="openEditModal('${d.hwid}')" class="text-gray-400 hover:text-blue-600 transition" title="Düzenle">✏️</button>
                            </p>
                            <p class="text-xs text-gray-500 font-mono mt-1">${d.hwid}</p>
                            <p class="text-xs mt-1 text-blue-600">${displayModules}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${d.isActive ? 'checked' : ''} onchange="toggleStatus('${d.hwid}', ${!d.isActive})">
                                <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                                <span class="ms-2 text-sm font-medium ${d.isActive ? 'text-green-600' : 'text-gray-500'}">${d.isActive ? 'Aktif' : 'Pasif'}</span>
                            </label>
                            <button onclick="openModuleModal('${d.hwid}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-medium hover:bg-blue-200 transition">Modüller</button>
                            <button onclick="deleteHWID('${d.hwid}')" class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-sm font-medium hover:bg-red-500 hover:text-white transition">Sil</button>
                        </div>
                    </div>
                `}).join('');

                card.innerHTML = `
                    <div class="bg-gray-800 text-white px-4 py-3 font-semibold flex justify-between items-center">
                        <span>🏢 ${companyName}</span>
                        <span class="text-sm bg-gray-600 px-2 py-1 rounded">${devices.length} Cihaz</span>
                    </div>
                    <div>${devicesHTML}</div>
                `;
                container.appendChild(card);
            }
        }

        // Cihaz Bilgilerini Düzenleme (YENİ)
        function openEditModal(hwid) {
            const device = licensesData.find(d => d.hwid === hwid);
            if(!device) return;

            document.getElementById('editHwid').value = hwid;
            document.getElementById('editCompany').value = device.companyName || '';
            document.getElementById('editOwner').value = device.ownerName || '';
            
            document.getElementById('editInfoModal').classList.remove('hidden');
        }

        async function saveDeviceInfo() {
            const hwid = document.getElementById('editHwid').value;
            const companyName = document.getElementById('editCompany').value;
            const ownerName = document.getElementById('editOwner').value;

            if(!companyName || !ownerName) return showMessage("Şirket ve Kullanıcı adı boş bırakılamaz.", true);

            try {
                const res = await fetch(`${API_BASE}/admin/updateInfo`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({ hwid, companyName, ownerName })
                });
                const json = await res.json();
                if(json.success) {
                    closeModal('editInfoModal');
                    fetchLicenses(); // Listeyi yenile (Cihaz yeni şirket klasörüne taşınacak)
                } else showMessage(json.message, true);
            } catch(e) { showMessage("Hata oluştu.", true); }
        }

        // Diğer İşlevler
        async function toggleStatus(hwid, newStatus) {
            try {
                const res = await fetch(`${API_BASE}/admin/toggleStatus`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({ hwid, isActive: newStatus })
                });
                const json = await res.json();
                if(json.success) fetchLicenses();
                else showMessage(json.message, true);
            } catch(e) { showMessage("Hata oluştu.", true); }
        }

        async function deleteHWID(hwid) {
            if(!confirm("Bu cihazı silmek istediğinize emin misiniz?")) return;
            try {
                const res = await fetch(`${API_BASE}/admin/deleteHWID`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({ hwid })
                });
                const json = await res.json();
                if(json.success) fetchLicenses();
                else showMessage(json.message, true);
            } catch(e) { showMessage("Hata oluştu.", true); }
        }

        function openModuleModal(hwid) {
            const device = licensesData.find(d => d.hwid === hwid);
            if(!device) return;

            document.getElementById('modalHwid').value = hwid;
            document.getElementById('modalTitle').textContent = `${device.ownerName} - Modülleri`;
            
            const list = document.getElementById('modulesList');
            list.innerHTML = '';
            
            ALL_MODULES.forEach(mod => {
                const isChecked = device.modulesMap[mod] ? 'checked' : '';
                const displayMod = STD_MODULES.includes(mod) 
                    ? `<span class="font-medium">${mod} <span class="text-xs text-gray-400">(std)</span></span>` 
                    : mod;

                list.innerHTML += `
                    <label class="flex items-center space-x-2 text-sm cursor-pointer hover:bg-gray-50 p-1 rounded">
                        <input type="checkbox" value="${mod}" class="mod-checkbox rounded text-blue-600" ${isChecked}>
                        <span>${displayMod}</span>
                    </label>
                `;
            });

            document.getElementById('moduleModal').classList.remove('hidden');
        }

        async function saveModules() {
            const hwid = document.getElementById('modalHwid').value;
            const checkboxes = document.querySelectorAll('.mod-checkbox');
            const newModulesMap = {};
            checkboxes.forEach(cb => { newModulesMap[cb.value] = cb.checked; });

            try {
                const res = await fetch(`${API_BASE}/admin/updateModules`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({ hwid, modules: newModulesMap })
                });
                const json = await res.json();
                if(json.success) {
                    closeModal('moduleModal');
                    fetchLicenses();
                } else showMessage(json.message, true);
            } catch(e) { showMessage("Hata oluştu.", true); }
        }

        function showNewLicenseModal() { document.getElementById('newLicenseModal').classList.remove('hidden'); }
        
        async function createNewLicense() {
            const hwid = document.getElementById('newHwid').value;
            const companyName = document.getElementById('newCompany').value;
            const ownerName = document.getElementById('newOwner').value;

            if(!hwid || !ownerName) return showMessage("HWID ve Kullanıcı Adı zorunludur.", true);

            try {
                const res = await fetch(`${API_BASE}/admin/registerHWID`, {
                    method: "POST", headers: getHeaders(),
                    body: JSON.stringify({ hwid, companyName, ownerName, isActive: true, modules: ALL_MODULES })
                });
                const json = await res.json();
                if(json.success) {
                    closeModal('newLicenseModal');
                    fetchLicenses();
                } else showMessage(json.message, true);
            } catch(e) { showMessage("Hata oluştu.", true); }
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
